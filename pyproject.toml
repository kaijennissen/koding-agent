[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koding_agent"]

[project]
name = "koding-agent"
version = "0.3.0"
description = "A coding agent built from scratch with an XML action loop calling Ollama."
requires-python = ">=3.14.4"
dependencies = [
    "structlog",
    "httpx2",
    "textual>=8.2.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
koding-agent = "koding_agent.cli:cli"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "pytest-asyncio>=1.4.1",
    "types-pyyaml>=6.0.12.20261103",
    "import-linter>=2.15",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test files may share a basename across directories.
# pythonpath keeps the shared `fakes` module importable.
pythonpath = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.importlinter]
root_packages = ["koding_agent", "textual", "rich"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core knows nothing about front ends"
type = "forbidden"
source_modules = ["koding_agent.core"]
forbidden_modules = [
    "koding_agent.cli",
    "koding_agent.console",
    "koding_agent.banner",
    "koding_agent.tui",
    "textual",
    "rich",
]

[[tool.importlinter.contracts]]
name = "Core layering"
type = "layers"
layers = [
    "koding_agent.core.loop",
    "koding_agent.core.events | koding_agent.core.prompts",
    "koding_agent.core.tools",
    "koding_agent.core.limits | koding_agent.core.context | koding_agent.core.llm | koding_agent.core.protocol",
]
